name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: tool-mockbox run examples/healthy.json examples/healthy-requests.jsonl --output run-output
      - run: python examples/retry_demo.py
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: healthy-report-${{ matrix.os }}-py${{ matrix.python }}
          path: run-output/
          if-no-files-found: error
          retention-days: 7
  mcp-integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[mcp]" "mcp==2.3.0"
      - run: python -m unittest discover -s tests -v
      - run: python examples/mcp_client.py
      - run: python examples/mcp_client.py --mode legacy
      - run: python examples/mcp_retry_client.py
      - run: python examples/mcp_retry_client.py --mode legacy
